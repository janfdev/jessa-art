<script>/* public build: embedded, sound is off until the visitor turns it on (added by build-public.py) */
(()=>{if(window.top===window) return; let on=false; try{on=sessionStorage.getItem("lum-sound")==="on";}catch(e){}
  window.LUM_SOUND=on; const media=new Set(), gains=[];
  const P=HTMLMediaElement.prototype, play=P.play;
  P.play=function(){if(this.tagName==="AUDIO"){media.add(this); this.muted=!window.LUM_SOUND;} return play.apply(this,arguments);};
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){const W=function(...a){const c=new AC(...a), g=c.createGain(); g.gain.value=window.LUM_SOUND?1:0; g.connect(c.destination);
      Object.defineProperty(c,"destination",{get:()=>g}); gains.push(g); return c;}; W.prototype=AC.prototype; window.AudioContext=window.webkitAudioContext=W;}
  const set=v=>{window.LUM_SOUND=v; media.forEach(m=>m.muted=!v); document.querySelectorAll("audio").forEach(m=>m.muted=!v);
    gains.forEach(g=>g.gain.value=v?1:0); document.querySelectorAll("iframe").forEach(f=>{try{f.contentWindow.postMessage({lumSound:v},"*");}catch(e){}});};
  addEventListener("message",e=>{if(e.data&&typeof e.data.lumSound==="boolean") set(e.data.lumSound);});})();</script>

<meta charset="utf-8">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="favicon-180.png">

<title>Seoul 3062 · Holo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Seoul 3062 as a hologram on a dark table: every building is its own glowing outline, drawn in code. */
:root{
  --bg:#030b1a; --fg:#0d2240; --muted:#5b7393; --blue:#1f7cff; --cyan:#33c6ff; --holo:#7fe3ff;
  --line-strong:rgba(40,120,230,.34);
  --display:"Michroma","Eurostile",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 45%,#0a2347 0%,#05132a 45%,var(--bg) 100%);color:#d8f3ff;font:14px/1.5 var(--body);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:var(--cur)}
#cv.drag{cursor:var(--cur)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(127,227,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}

.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(3,11,26,.85),rgba(3,11,26,0))}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--holo);font:500 11.5px var(--mono);letter-spacing:.08em;
  padding:7px 12px;border:1px solid rgba(127,227,255,.4);border-radius:999px;background:rgba(10,35,70,.6)}
.ttl{display:grid;line-height:1.25;flex:1;min-width:0}
.ttl small{font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.ttl b{font:400 17px var(--display);letter-spacing:.1em;text-shadow:0 0 12px rgba(127,227,255,.6)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.ctrls button{background:rgba(10,35,70,.7);border:1px solid rgba(127,227,255,.45);border-radius:999px;padding:6px 12px;cursor:var(--cur-hover);
  font:500 11px var(--mono);letter-spacing:.06em;color:var(--holo);backdrop-filter:blur(6px)}
.ctrls button[aria-pressed="true"]{background:rgba(51,198,255,.9);color:#03142b;border-color:var(--cyan)}

#ov{position:fixed;inset:0;z-index:2;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:500 10px var(--mono);letter-spacing:.28em;text-transform:uppercase;
  color:rgba(170,235,255,.75);text-shadow:0 0 8px rgba(51,198,255,.9)}
.pin{all:unset;position:absolute;transform:translate(-50%,-100%);cursor:var(--cur-hover);pointer-events:auto;display:grid;justify-items:center}
.pin .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(3,20,43,.85);border:1.5px solid var(--holo);
  font:600 11px var(--body);color:#eaffff;box-shadow:0 0 12px rgba(51,198,255,.9),inset 0 0 6px rgba(51,198,255,.5);transition:transform .2s,background .2s}
.pin .stem{width:1px;height:18px;background:linear-gradient(var(--holo),transparent)}
.pin:hover .dot,.pin:focus-visible .dot,.pin[aria-expanded="true"] .dot{transform:scale(1.2);background:var(--cyan);color:#03142b}
.pin .tip{position:absolute;bottom:calc(100% + 4px);white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;
  font:500 11px var(--mono);letter-spacing:.06em;color:#eaffff;background:rgba(3,20,43,.9);border:1px solid rgba(127,227,255,.6);border-radius:6px;padding:4px 8px}
.pin:hover .tip,.pin:focus-visible .tip{opacity:1}

.card{position:fixed;z-index:7;right:16px;top:76px;bottom:16px;width:min(340px,calc(100% - 32px));overflow:auto;padding:18px 18px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(246,252,255,.92),rgba(232,245,255,.86));backdrop-filter:blur(16px) saturate(1.3);color:var(--fg);
  border:1px solid rgba(120,200,255,.8);box-shadow:0 0 30px rgba(51,198,255,.35),0 20px 50px rgba(0,0,0,.4);display:grid;gap:12px;align-content:start}
.card .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.85);cursor:var(--cur-hover);color:var(--blue);font-size:16px}
.card small{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.card h2{margin:0;font:400 18px/1.35 var(--display);letter-spacing:.04em;padding-right:34px}
.card p{margin:0}
.card h4{margin:6px 0 0;font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--blue);display:flex;gap:10px;align-items:center}
.card h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
.rooms{display:grid;gap:8px}
.room{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid rgba(40,110,200,.14);background:rgba(255,255,255,.6)}
.room img{width:96px;height:54px;object-fit:cover;border-radius:5px;image-rendering:pixelated}
.room b{font-weight:600;font-size:13px;display:block}
.room span{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line-strong);border-radius:8px;text-align:center}
.hint{position:fixed;z-index:3;left:16px;bottom:14px;font:500 10.5px var(--mono);letter-spacing:.06em;color:#cfefff;background:rgba(3,20,43,.7);border:1px solid rgba(127,227,255,.4);border-radius:6px;padding:5px 9px}
.err{position:fixed;inset:0;display:grid;place-items:center;z-index:9;color:#cfefff;font:500 13px var(--mono);text-align:center;padding:24px}
@media (max-width:760px){.ttl small{display:none}.card{top:auto;height:60%;left:12px;right:12px;width:auto}.hint{display:none}}

/* in the game's journal: only the places he has found; the rest of the city sits under a blurred, glitching "signal lost" haze */
.fog{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;
  backdrop-filter:blur(7px) saturate(.25) brightness(.55);-webkit-backdrop-filter:blur(7px) saturate(.25) brightness(.55);
  background:repeating-linear-gradient(0deg,rgba(127,212,255,.05) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,rgba(3,12,28,.15),rgba(3,12,28,.55));
  -webkit-mask:radial-gradient(circle var(--r,140px) at var(--x,50%) var(--y,50%),transparent 55%,#000 100%);mask:radial-gradient(circle var(--r,140px) at var(--x,50%) var(--y,50%),transparent 55%,#000 100%)}
.game .fog{display:block}
.fog .lost{position:absolute;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,120,140,.55);text-shadow:0 0 8px rgba(255,80,110,.5)}
.fog .lost b{display:block;font-weight:500;color:rgba(191,244,255,.45);letter-spacing:.2em;margin-top:4px;text-shadow:none}
@media (prefers-reduced-motion:no-preference){.fog .lost{animation:lostflick 4.6s steps(1) infinite}@keyframes lostflick{0%,100%{opacity:1}7%{opacity:.25;transform:translateX(3px)}9%{opacity:1;transform:none}52%{opacity:.6}54%{opacity:1}}}
.game .pin.unknown,.game .lab.unknown{display:none!important}
/* the one place he knows is easy to find: its name stays up, and the whole lit area answers the mouse */
.game .pin{display:none!important}   /* in the game the lit area itself is the button */
.areachip{position:fixed;z-index:6;pointer-events:none;display:none;transform:translate(16px,14px);padding:7px 12px 7px 8px;border-radius:3px 12px 3px 12px;white-space:nowrap;
  font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,rgba(16,34,62,.85),rgba(8,20,42,.7));
  border:1px solid rgba(125,218,255,.7);box-shadow:0 0 16px rgba(51,198,255,.4)}
.areachip b{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;background:#33c6ff;color:#03142b;font-weight:600}
.areachip.on{display:block}
.game .fog.hot{filter:brightness(1.12)}
.game #tRide{display:none}
.gamehint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:4;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(191,244,255,.75);padding:7px 14px;border-radius:999px;background:rgba(3,20,43,.55);border:1px solid rgba(127,212,255,.25);display:none}
.game .gamehint{display:block}
/* embedded inside the storyboard */
.embed .top{display:none}
.embed .card{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:64px;width:min(420px,calc(100% - 28px));max-height:min(62vh,560px)}
.embed .hint{left:50%;transform:translateX(-50%);bottom:16px}
.embed .hint{transform:translateX(calc(-50% - 230px))}
.embed .ctrls.float{position:fixed;left:50%;transform:translateX(calc(-50% + 150px));bottom:12px}
@media (max-width:900px){.embed .ctrls.float{transform:none;left:auto;right:14px}.embed .hint{display:none}}

/* ---------- place modal: area art, lore and the episodes that use it ---------- */
.am{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 40%,rgba(10,40,80,.55),rgba(2,8,20,.82));backdrop-filter:blur(6px)}
.am-box{position:relative;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(14,46,88,.92),rgba(6,22,48,.94));border:1px solid rgba(127,227,255,.7);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 50px rgba(51,198,255,.35),0 40px 90px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:no-preference){.am-box{animation:amin .45s cubic-bezier(.2,.8,.2,1)}@keyframes amin{from{opacity:0;transform:translateY(16px) scale(.97)}}}
.am-box>.hb{position:absolute;z-index:4;width:14px;height:14px;border:2px solid var(--cyan);filter:drop-shadow(0 0 4px var(--cyan));pointer-events:none}
.am-box>.hb.a{top:6px;left:6px;border-width:2px 0 0 2px}.am-box>.hb.b{top:6px;right:6px;border-width:2px 2px 0 0}
.am-img{position:relative;flex:none;height:min(42vh,400px);overflow:hidden;background:#071a33}
.am-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.am-img::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,22,48,0) 55%,rgba(6,22,48,.95)),repeating-linear-gradient(0deg,rgba(127,227,255,.05) 0 1px,transparent 1px 3px)}
@media (prefers-reduced-motion:no-preference){
  .am-img.go img{animation:amreveal .9s cubic-bezier(.4,0,.2,1) both,amtint 1.1s ease-out both}
  @keyframes amreveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
  @keyframes amtint{0%{filter:brightness(1.8) saturate(.2) hue-rotate(-20deg)}100%{filter:none}}
  .am-img.go .scan{animation:amscan .9s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes amscan{from{top:0;opacity:1}90%{opacity:1}to{top:100%;opacity:0}}
}
.am-img .scan{position:absolute;left:0;right:0;top:100%;height:3px;z-index:2;background:linear-gradient(90deg,transparent,#bff4ff,#fff,#bff4ff,transparent);box-shadow:0 0 18px 6px rgba(51,198,255,.7)}
.am-tag{position:absolute;z-index:3;left:18px;bottom:16px;display:flex;align-items:center;gap:14px}
.am-tag .no{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--display);color:#03142b;background:var(--holo);box-shadow:0 0 0 3px rgba(3,20,43,.6),0 0 22px rgba(51,198,255,.9)}
.am-tag small{display:block;font:500 10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.am-tag h2{margin:2px 0 0;font:400 24px/1.2 var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 0 16px rgba(51,198,255,.8),0 2px 10px rgba(0,0,0,.6)}
.am-body{overflow:auto;scrollbar-width:thin;padding:18px 22px 20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 26px;color:#d8f3ff}
@media (max-width:760px){.am-body{grid-template-columns:1fr}.am-tag h2{font-size:19px}}
.am h4{margin:0 0 8px;font:500 10.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);display:flex;gap:10px;align-items:center}
.am h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(51,198,255,.6),transparent)}
.am-lore{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.am-lore li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.55;color:#cfe9ff}
.am-lore li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border:1px solid var(--holo);transform:rotate(45deg);box-shadow:0 0 6px var(--cyan)}
.am-hook{margin-top:14px;padding:11px 13px;border-radius:10px;background:linear-gradient(90deg,rgba(255,122,217,.14),rgba(255,122,217,.04));border-left:2px solid #ff7ad9;font-size:13px;line-height:1.5;color:#ffe1f6}
.am-hook b{display:block;margin-bottom:3px;font:500 9.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#ff9be3}
.am-ep{border-radius:10px;padding:10px 12px 12px;background:rgba(127,227,255,.06);border:1px solid rgba(127,227,255,.25)}
.am-ep+.am-ep{margin-top:10px}
.am-ep header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.am-ep header b{font:400 16px var(--display);color:var(--holo);text-shadow:0 0 10px rgba(51,198,255,.7)}
.am-ep header span{flex:1;font-weight:600;font-size:13px;color:#eaffff}
.am-ep header button{all:unset;cursor:var(--cur-hover);font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);padding:3px 8px;border-radius:999px;border:1px solid rgba(127,227,255,.45)}
.am-ep header button:hover,.am-ep header button:focus-visible{background:var(--cyan);color:#03142b}
.am-ep .note{font-size:12.5px;color:#9fc6e6}
.am-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.am-rooms button{all:unset;cursor:var(--cur-hover);display:grid;gap:4px;border-radius:7px;padding:3px;background:rgba(3,20,43,.6);box-shadow:0 0 0 1px rgba(127,227,255,.3);transition:transform .2s,box-shadow .2s}
.am-rooms button:hover,.am-rooms button:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 1px var(--holo),0 0 14px rgba(51,198,255,.6)}
.am-rooms img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px}
.am-rooms span{font-size:11px;font-weight:600;line-height:1.25;color:#eaffff;padding:0 3px 3px}
.am-none{font-size:13px;color:#9fc6e6;padding:12px;border:1px dashed rgba(127,227,255,.35);border-radius:10px;text-align:center}
.am-nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid rgba(127,227,255,.25);background:rgba(3,14,32,.6)}
.am-nav button{all:unset;cursor:var(--cur-hover);display:inline-flex;align-items:center;gap:8px;min-width:0;font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--holo);padding:6px 10px;border-radius:8px}
.am-nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-nav button:hover,.am-nav button:focus-visible{background:rgba(127,227,255,.12)}
.am-nav .nx{justify-self:end}
.am-dots{display:flex;gap:5px}.am-dots i{width:6px;height:6px;border-radius:50%;background:rgba(127,227,255,.3)}.am-dots i.on{background:var(--holo);box-shadow:0 0 8px var(--cyan)}
.am-x{all:unset;cursor:var(--cur-hover);position:absolute;z-index:5;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#03142b;background:var(--holo);box-shadow:0 0 16px rgba(51,198,255,.8)}
.am-x:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* text decode glyphs: the pixel run ahead of the letters as text builds in */
.dz-t{color:#33c6ff;text-shadow:0 0 6px rgba(51,198,255,.9);opacity:.9;font-weight:inherit}

/* riding the train: a small HUD, and the pins and hint step aside */
.ride{position:fixed;z-index:7;left:50%;top:84px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:999px;
  background:rgba(3,20,43,.72);border:1px solid rgba(127,227,255,.55);box-shadow:0 0 24px rgba(51,198,255,.35);backdrop-filter:blur(8px);color:#eaffff}
.ride[hidden]{display:none}
.ride .dot{width:9px;height:9px;border-radius:50%;background:#ff7ad9;box-shadow:0 0 10px #ff7ad9;animation:rideblink 1.4s infinite}
@keyframes rideblink{50%{opacity:.25}}
.ride b{display:block;font:400 14px var(--display);letter-spacing:.08em}
.ride small{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9fdcff}
.ride button{all:unset;cursor:var(--cur-hover);font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--holo);color:#03142b}
.ride button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ride .rv{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(127,227,255,.1);border:1px solid rgba(127,227,255,.3)}
.ride .rv button{background:none;color:#bff4ff;padding:5px 10px}
.ride .rv button:hover{background:rgba(127,227,255,.15)}
.ride .rv button[aria-pressed="true"]{background:rgba(51,198,255,.9);color:#03142b}
@media (max-width:760px){.ride{flex-wrap:wrap;justify-content:center;border-radius:18px;width:calc(100% - 32px)}}
.riding #ov,.riding .hint{opacity:0;pointer-events:none}
.riding #cv{cursor:var(--cur)}
:not(.embed) .ride{top:70px}

/* hologram cursor: a navy dart with a cyan edge and core line; on anything clickable it turns bright blue with targeting brackets */

<script>
const EMBED=new URLSearchParams(location.search).has("embed");
// ?game&known=7,2 : the in-game map (the journal). Only the places in "known" show, numbered in the order he found them
const QP=new URLSearchParams(location.search), GAME=QP.has("game"), KNOWN=(QP.get("known")||"7").split(",").map(Number).filter(Boolean), BEEN=(QP.get("been")||"").split(",").filter(Boolean);
if(GAME){document.documentElement.classList.add("game");
  document.body.insertAdjacentHTML("beforeend",'<div class="fog" id="fog" aria-hidden="true"><span class="lost" style="left:7%;top:22%">Signal lost<b>신호 없음 · unmapped</b></span><span class="lost" style="left:30%;top:64%">No data<b>데이터 없음</b></span><span class="lost" style="left:58%;top:16%">Unmapped<b>Not yet visited</b></span></div><div class="gamehint">Seoul fills in as Ji-yoo finds it · hover a lit place · 서울</div><div class="areachip" id="areachip"></div>');}
let HOLE=null;   // the lit area on screen: {x,y,r}
if(EMBED){document.documentElement.classList.add("embed");const c=document.querySelector(".ctrls");c.classList.add("float");document.body.appendChild(c);document.getElementById("hint").textContent="Drag · right-drag to tilt · scroll to zoom";}
if(!window.THREE){document.body.insertAdjacentHTML("beforeend",'<div class="err">The hologram needs an internet connection to load its 3D engine.<br>Connect and refresh.</div>');throw new Error("three missing");}

/* ---------- layout, in the same pixel coordinates as the painted map (1344 × 752) ---------- */
const W=1344,H=752, X=x=>x-W/2, Z=y=>y-H/2;
const RIVER_TOP=[[0,318],[200,322],[400,315],[600,300],[800,292],[1000,292],[1200,296],[1344,300]];
const RIVER_BOT=[[0,424],[300,430],[500,436],[700,444],[900,448],[1100,446],[1344,440]];
const RIVER=[...RIVER_TOP,...RIVER_BOT.slice().reverse()];
const BRIDGES=[60,640,840,1180,1290];
// one loop through every district: old Seoul, over the river into the new city, past the plaza, round Aevum, back over the east bridge, up through Seongbuk-gu and over Namsan's north side
const TRACK=[[461,98],[429,120],[384,142],[332,163],[300,181],[288,197],[290,222],[311,246],[344,288],[379,321],[410,350],[440,389],[468,426],[486,460],[487,500],[488,560],[480,640],[520,690],[600,702],[712,702],[830,702],[920,712],[1000,740],[1122,742],[1250,722],[1318,640],[1322,540],[1290,470],[1210,440],[1180,400],[1180,320],[1196,262],[1240,200],[1250,120],[1190,52],[1060,26],[900,18],[690,10],[530,22]];
const STATIONS=[[300,240],[488,540],[712,702],[1122,742],[1180,262],[690,10]];
const NAMSAN={x:690,y:150,rx:200,ry:118};
const AEVUM={x:1122,y:572};
const PLACES=[
 {n:1,x:215,y:205,h:14,name:"Hae's neighborhood",side:"Hae",blurb:"Old Seoul, north of the river. Layered, foggy and falling apart, with her father's apartment at the center of it.",rooms:[["08-hae-apartment","Hae's apartment"],["09-stairwell","The stairwell"],["10-hae-street","Hae's street"]]},
 {n:2,x:300,y:252,h:16,name:"Coffee stand + station",side:"Hae",blurb:"The one warm spot on a cold street, right under the train line. The barista bot is starting to crack.",rooms:[["11-coffee-stand","The coffee stand"]]},
 {n:3,x:95,y:115,h:12,name:"The pojangmacha",side:"Hae",blurb:"An alley off an old market street. No bots, no dots. The halmoni knows her order.",rooms:[["21-pojangmacha","The pojangmacha"]]},
 {n:4,x:420,y:368,h:20,name:"The train line",side:"Hae",blurb:"Hae's ride from old Seoul across the Han River into the new city. The view changes the whole way.",rooms:[["12-train","The train"]]},
 {n:5,x:712,y:505,h:34,name:"RRU Special Investigations",side:"Hae",blurb:"The state's polished building on the plaza. Precinct, bullpen and the briefing room.",rooms:[["13-precinct","The precinct"],["14-bullpen","The RRU bullpen"],["15-briefing-room","The briefing room"]]},
 {n:6,x:1110,y:150,h:40,name:"Seongbuk-gu",side:"Hae",blurb:"A quiet leafy hillside. The Kim apartment, where the Mira-class case begins.",rooms:[["16-seongbuk-kitchen","Seongbuk-gu kitchen"],["17-cordon","The cordon outside"]]},
 {n:7,x:AEVUM.x,y:AEVUM.y,h:250,name:"Aevum headquarters",side:"Aevum",blurb:"The tower Ji-yoo has never left. His room, the labs, the diagnostic bay and the boardroom are all inside.",rooms:[["01-ji-yoo-room","Ji-yoo's room"],["02-corridor","Research corridor"],["03-elevator","The elevator"],["04-lower-corridor","Lower corridor"],["07-lab","The lab"],["18-ha-eun-office","Ha-Eun's office"],["19-diagnostic-bay","Diagnostic Bay 3"],["20-boardroom","The boardroom"],["05-aevum-tower","Aevum Tower (EP 2)"]]},
 {n:8,x:170,y:560,h:120,name:"The new city",side:"World",blurb:"Glass towers and parks on the wealthy side of the river. Where most of Aevum's companions live.",rooms:[]},
 {n:9,x:NAMSAN.x,y:NAMSAN.y-18,h:132,name:"Namsan + N Seoul Tower",side:"World",blurb:"Visible from all over the city. A fixed point between the old and the new.",rooms:[]}
];
const LABELS=[["Old Seoul",230,40,4],["Namsan",690,262,70],["Seongbuk-gu",1120,30,4],["Han River",900,372,2],["New City",230,738,4],["Government",712,740,4],["Aevum",1122,738,4]];

/* ---------- helpers ---------- */
let seed=3062; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); const rr=(a,b)=>a+(b-a)*rnd();
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const nearRiver=(x,y,m)=>inPoly(x,y,RIVER)||inPoly(x,y-m,RIVER)||inPoly(x,y+m,RIVER);
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
const nearTrack=(x,y,m)=>TRACK.some((p,i)=>i&&distSeg(x,y,TRACK[i-1][0],TRACK[i-1][1],p[0],p[1])<m);
const inNamsan=(x,y,k=1)=>((x-NAMSAN.x)/(NAMSAN.rx*k))**2+((y-NAMSAN.y)/(NAMSAN.ry*k))**2<1;
const nearAevum=(x,y,r)=>Math.hypot(x-AEVUM.x,y-AEVUM.y)<r;
const nearBridge=(x,m)=>BRIDGES.some(b=>Math.abs(x-b)<m);

/* ---------- scene ---------- */
const cv=document.getElementById("cv");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x030b1a,1300,2800);
const camera=new THREE.PerspectiveCamera(38,1,1,5000);
const HOME={pos:new THREE.Vector3(0,860,980),tgt:new THREE.Vector3(0,0,40)};
if(EMBED){HOME.pos.multiplyScalar(1.32);}
// in the game, the camera starts over the newest place he has found (Aevum, to begin with)
if(GAME){const a=PLACES.find(q=>q.n===KNOWN[KNOWN.length-1])||PLACES[6]; HOME.tgt.set(X(a.x),0,Z(a.y)); HOME.pos.set(X(a.x)-60,560,Z(a.y)+620);}
camera.position.copy(HOME.pos);
const controls=new THREE.OrbitControls(camera,cv);
controls.target.copy(HOME.tgt); controls.enableDamping=true; controls.dampingFactor=.08; controls.screenSpacePanning=false;
controls.minDistance=180; controls.maxDistance=1900; controls.maxPolarAngle=1.32; controls.minPolarAngle=.15;
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};
controls.addEventListener("start",()=>cv.classList.add("drag")); controls.addEventListener("end",()=>cv.classList.remove("drag"));

const add=(o)=>{scene.add(o);return o;};
const lineMat=(c,o)=>new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});
const fillMat=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
function polyline(pts,mat,y=0){const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(X(p[0]),p[2]??y,Z(p[1]))));return add(new THREE.Line(g,mat));}

/* no table: the city floats on an endless faint grid that melts away towards the edges */
const grid=(()=>{const R=1500, step=30, pos=[], col=[], c=new THREE.Color(0x1f7cff);
  const fade=(x,z)=>{const d=Math.hypot(x/1.25,z)/R; return Math.max(0,1-d*d)*Math.max(0,1-d)*1.2;};
  for(let v=-R;v<=R;v+=step){for(let u=-R;u<R;u+=step){
    [[u,v,u+step,v],[v,u,v,u+step]].forEach(([x0,z0,x1,z1])=>{pos.push(x0,0,z0,x1,0,z1); [fade(x0,z0),fade(x1,z1)].forEach(f=>col.push(c.r*f,c.g*f,c.b*f));});}}
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});
  const l=add(new THREE.LineSegments(g,m)); l.position.y=-1.5; return l;})();
// soften the ends of anything that runs to the map's left and right edges (the river), so nothing stops at a hard line
function fadeEnds(obj,m=170){const g=obj.geometry, p=g.attributes.position, col=[];
  for(let i=0;i<p.count;i++){const x=p.getX(i), d=Math.min(x+W/2,W/2-x), f=Math.max(0,Math.min(1,d/m)); const e=f*f*(3-2*f); col.push(e,e,e);}
  g.setAttribute("color",new THREE.Float32BufferAttribute(col,3)); obj.material.vertexColors=true; obj.material.needsUpdate=true; return obj;}

/* river */
const rs=new THREE.Shape(RIVER.map(([x,y])=>new THREE.Vector2(X(x),-Z(y))));
const rm=add(new THREE.Mesh(new THREE.ShapeGeometry(rs),fillMat(0x1f7cff,.16)));rm.rotation.x=-Math.PI/2;rm.position.y=.2; fadeEnds(rm);
fadeEnds(polyline(RIVER_TOP,lineMat(0x7fe3ff,.85),.5)); fadeEnds(polyline(RIVER_BOT,lineMat(0x7fe3ff,.85),.5));
const flows=[]; // flowing current lines
for(let k=1;k<6;k++){const pts=[];for(let x=0;x<=W;x+=24){const t=lerpEdge(RIVER_TOP,x),b=lerpEdge(RIVER_BOT,x);pts.push([x,t+(b-t)*k/6]);}
  const l=polyline(pts,new THREE.LineDashedMaterial({color:0x7fe3ff,transparent:true,opacity:.22,dashSize:14,gapSize:30,blending:THREE.AdditiveBlending,depthWrite:false}),.4);l.computeLineDistances();fadeEnds(l);flows.push(l);}
function lerpEdge(E,x){for(let i=1;i<E.length;i++){if(x<=E[i][0]){const t=(x-E[i-1][0])/(E[i][0]-E[i-1][0]);return E[i-1][1]+(E[i][1]-E[i-1][1])*t;}}return E[E.length-1][1];}

/* bridges */
BRIDGES.forEach(bx=>{const t=lerpEdge(RIVER_TOP,bx)-14,b=lerpEdge(RIVER_BOT,bx)+14;
  polyline([[bx-5,t,4],[bx-5,b,4]],lineMat(0xbff2ff,.8)); polyline([[bx+5,t,4],[bx+5,b,4]],lineMat(0xbff2ff,.8));
  for(let y=t+12;y<b;y+=26){polyline([[bx-5,y,0],[bx-5,y,4]],lineMat(0x7fe3ff,.4));polyline([[bx+5,y,0],[bx+5,y,4]],lineMat(0x7fe3ff,.4));}});
/* riverside + main roads */
const roadM=lineMat(0x2b9bff,.32);
polyline(RIVER_TOP.map(([x,y])=>[x,y-14]),roadM,.3); polyline(RIVER_BOT.map(([x,y])=>[x,y+14]),roadM,.3);
[[712,462,712,752],[600,462,600,752],[880,462,880,752],[960,462,960,752],[0,600,600,600],[880,640,960,640],[580,0,560,290],[880,0,890,280]].forEach(([a,b,c,d])=>polyline([[a,b],[c,d]],roadM,.3));
BRIDGES.forEach(bx=>{polyline([[bx,0],[bx,lerpEdge(RIVER_TOP,bx)-14]],roadM,.3);polyline([[bx,lerpEdge(RIVER_BOT,bx)+14],[bx,752]],roadM,.3);});

/* ---------- buildings: shaped by district (hanok roofs, apartment slabs, setback, round, twisted and tapered towers) ---------- */
const DIST={};
// L = outline segments, D = faint detail (floor bands), F = fill triangles
function district(key,color,lineOp,fillOp){DIST[key]={c:color,lo:lineOp,fo:fillOp,L:[],D:[],F:[]};}
district("old",0x9fe8ff,.55,.05); district("seong",0x7fe3ff,.6,.05); district("city",0x5fd2ff,.62,.06); district("gov",0xd6f6ff,.75,.07); district("aev",0xc7d3ff,.85,.09); district("east",0x5fd2ff,.55,.05);
const free=(x,y,m=10)=>!nearRiver(x,y,m+8)&&!nearTrack(x,y,m+4)&&!nearBridge(x,m)&&x>m&&x<W-m&&y>m&&y<H-m;
const rect=(w,d)=>[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]];
const ring=(n,rx,rz,off=0)=>Array.from({length:n},(_,i)=>{const a=off+i/n*Math.PI*2;return [Math.cos(a)*rx,Math.sin(a)*rz];});
const LIGHTS=[], TALL=[], BOARDS=[];

// a prism on footprint fp, from y0 to y1; the top can shrink (s) and twist (tw)
function prism(k,x,y,r,fp,y0,y1,{s=1,tw=0,bands=0,cap=true}={}){
  const D=DIST[k],cx=X(x),cz=Z(y),n=fp.length;
  const at=(p,h,sc,a)=>{const c=Math.cos(r+a),sn=Math.sin(r+a),u=p[0]*sc,v=p[1]*sc;return [cx+u*c-v*sn,h,cz+u*sn+v*c];};
  const B=fp.map(p=>at(p,y0,1,0)),T=fp.map(p=>at(p,y1,s,tw));
  for(let i=0;i<n;i++){const j=(i+1)%n;
    D.L.push(...B[i],...B[j],...T[i],...T[j],...B[i],...T[i]);
    D.F.push(...B[i],...B[j],...T[j],...B[i],...T[j],...T[i]);
    if(cap&&i>0&&i<n-1) D.F.push(...T[0],...T[i],...T[i+1]);}
  for(let b=1;b<=bands;b++){const f=b/(bands+1),R=fp.map(p=>at(p,y0+(y1-y0)*f,1+(s-1)*f,tw*f));for(let i=0;i<n;i++) D.D.push(...R[i],...R[(i+1)%n]);}
}
const bandsFor=(h,step=13)=>Math.max(0,Math.floor(h/step)-1);
function spire(k,x,y,h0,len){DIST[k].L.push(X(x),h0,Z(y),X(x),h0+len,Z(y)); LIGHTS.push([X(x),h0+len,Z(y)]);}
function helipad(k,x,y,h,R){const D=DIST[k],P=ring(16,R,R).map(([u,v])=>[X(x)+u,h+.4,Z(y)+v]);for(let i=0;i<16;i++)D.L.push(...P[i],...P[(i+1)%16]);
  const c=[X(x),h+.4,Z(y)],q=R*.45;D.L.push(c[0]-q*.6,c[1],c[2]-q,c[0]-q*.6,c[1],c[2]+q, c[0]+q*.6,c[1],c[2]-q,c[0]+q*.6,c[1],c[2]+q, c[0]-q*.6,c[1],c[2],c[0]+q*.6,c[1],c[2]);}

// old Seoul: hanok with hip roofs and lifted eaves
function hanok(k,x,y,r,w,d,h){
  prism(k,x,y,r,rect(w,d),0,h,{cap:false});
