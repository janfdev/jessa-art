<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="only light" />
<title>Wordpit · kinetic type toy</title>
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#f4f1ea;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Helvetica Neue", Arial, sans-serif;
    background:var(--ink);
    color:#fff;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:16px 22px 12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:clamp(22px, 4vw, 34px);
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1;
    text-transform:lowercase;
  }
  header h1 .star{ color:#ffd400; }
  header p{
    font-size:12px;
    letter-spacing:0.5px;
    color:rgba(255,255,255,0.55);
    text-transform:uppercase;
  }

  .stage-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    padding:0 16px;
  }
  #stage{
    display:block;
    border-radius:18px;
    max-width:100%;
    max-height:100%;
    transition:background .45s ease;
    touch-action:none;
  }

  .panel{
    display:flex;
    gap:10px;
    padding:14px 22px calc(14px + env(safe-area-inset-bottom));
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .panel input[type=text]{
    flex:1;
    min-width:200px;
    max-width:520px;
    height:46px;
    padding:0 16px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:#fff;
    font-size:16px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .panel input[type=text]:focus{
    border-color:#ffd400;
    background:rgba(255,255,255,0.1);
  }
  .panel input[type=text]::placeholder{ color:rgba(255,255,255,0.4); }

  button.btn{
    height:46px;
    padding:0 20px;
    border-radius:12px;
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:transform .08s ease, filter .15s ease;
    white-space:nowrap;
  }
  button.btn:active{ transform:scale(0.96); }
  button.btn:focus-visible{ outline:3px solid #ffd400; outline-offset:2px; }
  .btn-go{ background:#ffd400; color:#0a0a0a; }
  .btn-shuffle{ background:#ff2d8a; color:#fff; }
  .btn-ghost{ background:rgba(255,255,255,0.1); color:#fff; }
  .btn svg{ width:17px; height:17px; }

  .toast{
    position:fixed;
    left:50%;
    bottom:88px;
    transform:translateX(-50%) translateY(12px);
    background:#fff;
    color:#0a0a0a;
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:560px){
    .panel input[type=text]{ flex-basis:100%; }
    header p{ display:none; }
  }
</style>

  <header>
    <h1>Wordpit <span class="star">✳</span></h1>
    <p>type · drop · shuffle</p>
  </header>

  <div class="stage-wrap">
    <canvas id="stage" width="420" height="560" aria-label="A floating blob full of word tags and starburst-eyed faces drifting around."></canvas>
  </div>

  <div class="panel">
    <input id="words" type="text" maxlength="120" value="this text effect is easier than you might think" placeholder="type your words..." aria-label="Words to drop into the pit" />
    <button class="btn btn-go" id="go" aria-label="Drop your words into the pit">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>drop it
    </button>
    <button class="btn btn-shuffle" id="shuffle" aria-label="Shuffle the colors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>shuffle
    </button>
    <button class="btn btn-ghost" id="share" aria-label="Copy a shareable link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>share
    </button>
  </div>

  <div class="toast" id="toast">link copied</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
  var C = document.getElementById('stage');
  var X = C.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  // logical size; scaled for retina
  var W = 420, H = 560;
  function sizeCanvas(){
    var wrap = C.parentElement;
    var avail = Math.min(wrap.clientWidth, 520);
    var availH = wrap.clientHeight;
    var ratio = W / H;
    var w = avail, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    C.style.width = w + "px";
    C.style.height = h + "px";
    C.width = W * DPR;
    C.height = H * DPR;
    X.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  var CX = W/2, CY = H/2;

  var FONT = '"Helvetica Neue", Arial, sans-serif';

  // Curated palettes: {bg, blob, accents[]}. Faces use black features so they read on any accent.
  var PALETTES = [
    { bg:"#1d1bff", blob:"#ff2d2d", accents:["#19d23a","#ffd400","#ff2d8a","#19c6ff","#ffffff"] },
    { bg:"#ff2d2d", blob:"#1d1bff", accents:["#ffd400","#19d23a","#ff2d8a","#ffffff","#19c6ff"] },
    { bg:"#0a0a0a", blob:"#ffd400", accents:["#ff2d8a","#19c6ff","#19d23a","#ff2d2d","#ffffff"] },
    { bg:"#ff7a00", blob:"#0a0a0a", accents:["#ffd400","#19c6ff","#ffffff","#ff2d8a","#19d23a"] },
    { bg:"#19d23a", blob:"#ff2d8a", accents:["#1d1bff","#ffd400","#ffffff","#19c6ff","#0a0a0a"] },
    { bg:"#ff2d8a", blob:"#19c6ff", accents:["#ffd400","#0a0a0a","#ffffff","#19d23a","#1d1bff"] },
    { bg:"#f4c95d", blob:"#26215c", accents:["#ff2d8a","#19c6ff","#ffffff","#19d23a","#ff2d2d"] },
    { bg:"#26215c", blob:"#f4c95d", accents:["#ff2d8a","#19c6ff","#ffffff","#19d23a","#ff7a00"] }
  ];
  var palIndex = 0, pal = PALETTES[0];

  var Engine = Matter.Engine, Bodies = Matter.Bodies, Composite = Matter.Composite, Body = Matter.Body;
  var engine, world, items, timers = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function measure(t, fs){ X.font = "700 " + fs + "px " + FONT; return X.measureText(t).width; }
  function spawnPos(){ var a = Math.random()*Math.PI*2, r = Math.random()*40; return { x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r }; }
  function nudge(b){ Body.setVelocity(b,{x:(Math.random()-0.5)*3,y:(Math.random()-0.5)*3}); Body.setAngularVelocity(b,(Math.random()-0.5)*0.1); }
  function ac(){ return pal.accents[Math.floor(Math.random()*pal.accents.length)]; }

  function addWord(w){
    var fs = 17 + Math.random()*6, pad = 10;
    var tw = measure(w, fs) + pad*2, th = fs + pad*1.2;
    var p = spawnPos();
    var b = Bodies.rectangle(p.x, p.y, tw, th, { restitution:0.8, friction:0, frictionAir:0.02, density:0.002, angle:(Math.random()-0.5)*0.6 });
    b.label = "word"; b.kt = { text:w, w:tw, h:th, fs:fs };
    items.push(b); Composite.add(world, b); nudge(b);
  }
  function addFace(){
    var r = 12 + Math.random()*7, p = spawnPos();
    var b = Bodies.circle(p.x, p.y, r, { restitution:0.85, friction:0, frictionAir:0.02, density:0.0015 });
    b.label = "face"; b.kt = { r:r, color:ac() };
    items.push(b); Composite.add(world, b); nudge(b);
  }
  function addStar(){
    var p = spawnPos();
    var b = Bodies.circle(p.x, p.y, 8, { restitution:0.85, friction:0, frictionAir:0.02, density:0.001 });
    b.label = "star"; b.kt = { r:9, color:ac() };
    items.push(b); Composite.add(world, b); nudge(b);
  }

  function build(words){
    timers.forEach(clearTimeout); timers = [];
    if (world) Composite.clear(world);
    engine = Engine.create();
    engine.gravity.x = 0; engine.gravity.y = 0;
    world = engine.world; items = [];

    var t = 200;
    words.forEach(function(w){
      timers.push(setTimeout(function(){ addWord(w); }, t));
      t += 330;
      if (Math.random() < 0.7){ timers.push(setTimeout(function(){ Math.random()<0.5 ? addFace() : addStar(); }, t-110)); }
    });
    for (var k=0;k<3;k++){ timers.push(setTimeout(function(){ Math.random()<0.5 ? addFace() : addStar(); }, t + k*230)); }
  }

  function containment(){
    var maxR = 160;
    items.forEach(function(b){
      if (b.kt && b.kt.dragging) return;   // the user owns this one — don't tug it back
      var dx = b.position.x - CX, dy = b.position.y - CY, d = Math.sqrt(dx*dx+dy*dy) || 1;
      Body.applyForce(b, b.position, { x:-dx/d*0.0000072*b.mass*d, y:-dy/d*0.0000072*b.mass*d });
      if (d > maxR){ var k = (d-maxR)*0.0008*b.mass; Body.applyForce(b, b.position, { x:-dx/d*k, y:-dy/d*k }); }
      var sp = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
      if (sp < 0.4){ Body.applyForce(b, b.position, { x:(Math.random()-0.5)*0.00008*b.mass, y:(Math.random()-0.5)*0.00008*b.mass }); }
    });
  }

  function hull(points){
    points = points.slice().sort(function(a,b){ return a.x-b.x || a.y-b.y; });
    var n = points.length; if (n < 3) return points;
    var cross = function(o,a,b){ return (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x); };
    var lo=[]; for (var i=0;i<n;i++){ while(lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],points[i])<=0) lo.pop(); lo.push(points[i]); }
    var up=[]; for (var j=n-1;j>=0;j--){ while(up.length>=2 && cross(up[up.length-2],up[up.length-1],points[j])<=0) up.pop(); up.push(points[j]); }
    lo.pop(); up.pop(); return lo.concat(up);
  }

  function drawBlob(){
    var pts = [];
    items.forEach(function(b){
      if (b.label === "word"){
        var c = Math.cos(b.angle), s = Math.sin(b.angle), hw = b.kt.w/2+13, hh = b.kt.h/2+13;
        [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].forEach(function(p){ pts.push({ x:b.position.x+p[0]*c-p[1]*s, y:b.position.y+p[0]*s+p[1]*c }); });
      } else if (b.label === "face"){
        pts.push({x:b.position.x,y:b.position.y-b.kt.r-11});
        pts.push({x:b.position.x+b.kt.r+11,y:b.position.y});
        pts.push({x:b.position.x-b.kt.r-11,y:b.position.y});
        pts.push({x:b.position.x,y:b.position.y+b.kt.r+11});
      }
    });
    if (pts.length < 3) return;
    var h = hull(pts);
    X.beginPath();
    X.moveTo((h[h.length-1].x+h[0].x)/2,(h[h.length-1].y+h[0].y)/2);
    for (var i=0;i<h.length;i++){ var a=h[i], b=h[(i+1)%h.length], mx=(a.x+b.x)/2, my=(a.y+b.y)/2; X.quadraticCurveTo(a.x,a.y,mx,my); }
    X.closePath(); X.fillStyle = pal.blob; X.fill();
  }

  function starShape(cx,cy,r,color){ X.save(); X.translate(cx,cy); X.fillStyle=color; for(var k=0;k<8;k++){ X.rotate(Math.PI/4); X.fillRect(-1.8,-r,3.6,r); } X.restore(); }
  function starEye(x,y,r){ X.save(); X.translate(x,y); X.fillStyle="#000"; for(var k=0;k<8;k++){ X.rotate(Math.PI/4); X.fillRect(-0.9,-r,1.8,r); } X.restore(); }

  function drawFace(b){
    var r = b.kt.r;
    X.save(); X.translate(b.position.x, b.position.y); X.rotate(b.angle);
    X.beginPath(); X.arc(0,0,r,0,Math.PI*2); X.fillStyle = b.kt.color; X.fill();
    var er = r*0.28;
    starEye(-r*0.38, -r*0.15, er); starEye(r*0.38, -r*0.15, er);
    var mw = r*0.7, my = r*0.45, mh = Math.max(2, r*0.12);
    X.fillStyle = "#000"; X.fillRect(-mw/2, my-mh/2, mw, mh);
    X.restore();
  }

  function draw(){
    X.fillStyle = pal.bg; X.fillRect(0,0,W,H);
    drawBlob();
    items.forEach(function(b){
      if (b.label === "word"){
        X.save(); X.translate(b.position.x, b.position.y); X.rotate(b.angle);
        X.fillStyle = "#000"; X.fillRect(-b.kt.w/2, -b.kt.h/2, b.kt.w, b.kt.h);
        X.fillStyle = "#fff"; X.font = "700 " + b.kt.fs + "px " + FONT;
        X.textAlign = "center"; X.textBaseline = "middle";
        X.fillText(b.kt.text, 0, 1); X.restore();
      } else if (b.label === "face"){ drawFace(b); }
      else if (b.label === "star"){ starShape(b.position.x, b.position.y, b.kt.r, b.kt.color); }
    });
  }

  function loop(){
    if (!reduceMotion){ containment(); Engine.update(engine, 1000/60); }
    draw();
    requestAnimationFrame(loop);
  }

  function applyPalette(){
    C.style.background = pal.bg;
    if (items) items.forEach(function(b){ if (b.label==="face" || b.label==="star") b.kt.color = ac(); });
    syncURL();
  }
  function shuffle(){
    var next; do { next = Math.floor(Math.random()*PALETTES.length); } while (next === palIndex && PALETTES.length>1);
    palIndex = next; pal = PALETTES[palIndex]; applyPalette();
  }

  function currentWords(){
    var raw = document.getElementById('words').value.trim();
    var words = raw.split(/\s+/).filter(Boolean).slice(0, 16);
    if (!words.length) words = ["type","some","words"];
    return words;
  }
  function run(){ build(currentWords()); syncURL(); }

  // ---- share / persistence via URL hash ----
  function syncURL(){
    var raw = document.getElementById('words').value.trim();
    var params = new URLSearchParams();
    params.set('w', raw);
    params.set('p', String(palIndex));
    history.replaceState(null, '', '#' + params.toString());
  }
  function loadFromURL(){
    if (!location.hash) return false;
    try {
      var params = new URLSearchParams(location.hash.slice(1));
      var w = params.get('w'); var p = parseInt(params.get('p'), 10);
      if (!isNaN(p) && p >= 0 && p < PALETTES.length){ palIndex = p; pal = PALETTES[p]; }
      if (w){ document.getElementById('words').value = w; }
      return true;
    } catch(e){ return false; }
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
  }
  function share(){
    syncURL();
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('link copied'); }, function(){ toast('copy failed'); });
    } else { toast('copy this URL'); }
  }

  // ---- drag items around the square with mouse / touch ----
  var Query = Matter.Query;
  var drag = null, grabOff = { x:0, y:0 }, lastP = { x:0, y:0 }, vel = { x:0, y:0 };

  function toLogical(e){
    var rect = C.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top)  * (H / rect.height)
    };
  }
  // topmost item under the point, with a forgiving radius so a near-hover grabs it
  function bodyAt(p){
    for (var i = items.length - 1; i >= 0; i--){
      if (Query.point([items[i]], p).length) return items[i];
    }
    var best = null, bd = 30 * 30;
    for (var j = 0; j < items.length; j++){
      var b = items[j], dx = b.position.x - p.x, dy = b.position.y - p.y, d = dx*dx + dy*dy;
      if (d < bd){ bd = d; best = b; }
    }
    return best;
  }
  function onDown(e){
    var p = toLogical(e);
    var b = bodyAt(p);
    if (!b) return;
    drag = b; b.kt.dragging = true;
    grabOff = { x: b.position.x - p.x, y: b.position.y - p.y };
    lastP = { x: b.position.x, y: b.position.y };
    vel = { x:0, y:0 };
    Body.setStatic(b, true);                 // pin it so it follows the pointer exactly
    C.style.cursor = 'grabbing';
    if (C.setPointerCapture) C.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  function onMove(e){
    if (!drag){
      C.style.cursor = bodyAt(toLogical(e)) ? 'grab' : 'default';
      return;
    }
    var p = toLogical(e), m = 14;
    var tx = Math.max(m, Math.min(W - m, p.x + grabOff.x));
    var ty = Math.max(m, Math.min(H - m, p.y + grabOff.y));
    vel = { x: tx - lastP.x, y: ty - lastP.y };
    Body.setPosition(drag, { x: tx, y: ty });
    lastP = { x: tx, y: ty };
    e.preventDefault();
  }
  function onUp(e){
    if (!drag) return;
    var b = drag; drag = null;
    Body.setStatic(b, false);
    b.kt.dragging = false;
    var clamp = function(v){ return Math.max(-20, Math.min(20, v)); };
    Body.setVelocity(b, { x: clamp(vel.x), y: clamp(vel.y) });   // throw it on release
    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.06);
    C.style.cursor = 'grab';
    e.preventDefault();
  }
  C.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // ---- wire up ----
  document.getElementById('go').addEventListener('click', run);
  document.getElementById('shuffle').addEventListener('click', shuffle);
  document.getElementById('share').addEventListener('click', share);
  document.getElementById('words').addEventListener('keydown', function(e){ if (e.key === "Enter") run(); });
  window.addEventListener('resize', sizeCanvas);

  loadFromURL();
  sizeCanvas();
  C.style.background = pal.bg;
  build(currentWords());
  loop();
})();
</script>
