const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap');

html, body { margin:0; padding:0; }
.vt * { margin:0; padding:0; box-sizing:border-box; }
.vt {
  --ink:#0c0c0e; --paper:#f3f1ea; --accent:${ACCENT};
  --line:rgba(12,12,14,.14); --mut:#6f6d66;

.vt img,.vt button,.vt input{ font-family:inherit; }
.vt button{ cursor:pointer; border:none; background:none; color:inherit; }
.disp{ font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.01em; line-height:.92; text-transform:uppercase; }

.intro h1 b{ color:var(--accent); font-weight:400; }
.intro .bar{ position:absolute; bottom:0; left:0; height:3px; background:var(--accent); animation:load 1.4s cubic-bezier(.65,0,.35,1) forwards; }

/* announcement + marquee */
.ann{ background:var(--ink); color:var(--paper); text-align:center; font-size:11px;

.marq{ background:var(--accent); color:var(--ink); overflow:hidden; white-space:nowrap;

.marq .row{ display:inline-block; padding:13px 0; animation:slide 22s linear infinite; }
.marq span{ font-family:'Anton'; font-size:18px; text-transform:uppercase; letter-spacing:.04em; padding:0 26px; }
.marq span i{ font-style:normal; opacity:.4; }
@keyframes slide{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

/* header */
.topbar{ position:fixed; top:0; left:0; right:0; z-index:90; }
.hdr{ display:flex; align-items:center;
  justify-content:space-between; padding:18px clamp(16px,4vw,52px); transition:.4s ease; }
.hdr.solid{ background:rgba(243,241,234,.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding-top:13px; padding-bottom:13px; }
.logo{ font-family:'Anton'; font-size:26px; letter-spacing:.06em; text-transform:uppercase; }
.logo .dot{ color:var(--accent); }

.nav button::after{ content:''; position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--accent); transition:width .3s ease; }

.icons{ display:flex; gap:18px; align-items:center; }
.icons button{ font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
.cartcount{ background:var(--accent); color:var(--ink); border-radius:999px; min-width:19px; height:19px;

.light{ color:var(--paper); }
.light .nav button::after{ background:var(--accent); }
.burger{ display:none; flex-direction:column; gap:5px; width:30px; }

/* hero */

.hero .media{ position:absolute; inset:-10% 0; background:
  radial-gradient(120% 90% at 70% 20%, #2a2a30 0%, #131316 55%, #0a0a0c 100%); }
.hero .grid-lines{ position:absolute; inset:0; opacity:.5;

.reveal{ opacity:0; transform:translateY(34px); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }

.wrap{ padding:clamp(64px,10vh,128px) clamp(16px,4vw,52px); }

/* categories */
.cats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.cat{ position:relative; aspect-ratio:3/4; border-radius:4px; overflow:hidden; color:#fff; display:flex; align-items:flex-end; cursor:pointer; }

.pgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(10px,1.4vw,22px); }

.look .veil{ position:absolute; inset:0; z-index:2; background:linear-gradient(90deg, rgba(8,8,10,.82) 0%, rgba(8,8,10,.5) 46%, rgba(8,8,10,.15) 100%); }

/* ---------------- placeholder visual helpers ---------------- */
function Field({ a, b, label, ghost, tag, img, style }) {
  return (
    <div className="bg" style={{ background: `linear-gradient(150deg, ${a}, ${b})`, ...style }}>
      {img && <img src={img} alt={label || ""} loading="lazy" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
      {tag && <div className="hf-tag">{tag}</div>}
      {ghost && !img && <div className="ghost">{ghost}</div>}
      {label && (
        <div style={{ position: "absolute", left: 14, bottom: 12, zIndex: 2, color: "rgba(255,255,255,.85)",
          fontFamily: "Anton", fontSize: 15, textTransform: "uppercase", letterSpacing: ".04em" }}>
          {label}
        </div>
      )}
    </div>
  );
}

function Reveal({ children, delay = 0, as = "div", className = "", io, onClick }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) io(ref.current); }, [io]);
  const Tag = as;
  return <Tag ref={ref} onClick={onClick} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</Tag>;
}

              <div className="disp">Order placed</div>
              <p style={{ color: "var(--mut)", marginTop: 14 }}>Confirmation sent. Now go move.</p>
              <button className="btn dark" style={{ marginTop: 26 }} onClick={() => { setCart([]); nav("home"); }}>Back to home</button>
            </div>
          ) : (
            <>
              <div className="crumb">Cart / <b>Checkout</b></div>
              <div className="checkout">
                <div className="ck">
                  <div className="step">Step 2 of 2 — Shipping & payment</div>
                  <h2>Checkout</h2>
                  <label>Email</label><input placeholder="your@email.com" />
                  <div className="two">
                    <div><label>First name</label><input placeholder="Alex" /></div>
                    <div><label>Last name</label><input placeholder="Rivera" /></div>
                  </div>
                  <label>Address</label><input placeholder="123 Track Ave" />
                  <div className="two">
                    <div><label>City</label><input placeholder="Portland" /></div>
                    <div><label>ZIP</label><input placeholder="97201" /></div>
                  </div>
                  <label>Card number</label><input placeholder="4242 4242 4242 4242" />
                  <div className="two">
                    <div><label>Expiry</label><input placeholder="12 / 28" /></div>
                    <div><label>CVC</label><input placeholder="123" /></div>
                  </div>
                  <button className="btn dark" style={{ width: "100%", justifyContent: "center", marginTop: 26 }}
                    onClick={() => setPlaced(true)}>Place order — ${(subtotal + shipping).toFixed(2)}</button>
                </div>
                <div className="summary">
                  <h4>Order summary</h4>
                  {cart.map((x, i) => (
                    <div className="ln" key={i}><span>{x.name} ({x.size}) ×{x.qty}</span><span>${x.qty * x.price}</span></div>
                  ))}
                  <div className="ln"><span>Subtotal</span><span>${subtotal}</span></div>
                  <div className="ln"><span>Shipping</span><span>{shipping === 0 ? "Free" : `$${shipping}`}</span></div>
                  <div className="tot"><span>Total</span><span>${(subtotal + shipping).toFixed(2)}</span></div>
                </div>
              </div>
            </>
          )}
        </div>
      )}

      {/* ============ FOOTER (all views) ============ */}
      <footer className="foot">
        <div className="top">
          <div>
            <div className="logo">VANTA<span className="dot" style={{ color: ACCENT }}>.</span></div>
            <p>Performance sportswear engineered to move. A placeholder house brand built for this demo — swap in real branding and product per client.</p>
          </div>
          <div><h6>Shop</h6><ul><li onClick={() => { setFilter("Men"); nav("shop"); }}>Men</li><li onClick={() => { setFilter("Women"); nav("shop"); }}>Women</li><li onClick={() => { setFilter("Footwear"); nav("shop"); }}>Footwear</li><li onClick={() => { setFilter("Accessories"); nav("shop"); }}>Accessories</li></ul></div>
          <div><h6>Help</h6><ul><li>Shipping</li><li>Returns</li><li>Size guide</li><li>Contact</li></ul></div>
          <div><h6>Company</h6><ul><li>About</li><li>Sustainability</li><li>Careers</li><li>Stores</li></ul></div>
        </div>
        <div className="bot"><span>© 2026 VANTA — demo build</span><span>Privacy · Terms · Cookies</span></div>
      </footer>

      {/* ============ CART DRAWER ============ */}
      <div className={`scrim ${cartOpen ? "on" : ""}`} onClick={() => setCartOpen(false)} />
      <div className={`drawer ${cartOpen ? "on" : ""}`}>
        <div className="dh"><h4>Cart ({count})</h4><button onClick={() => setCartOpen(false)}>✕</button></div>
        <div className="items">
          {cart.length === 0 ? <div className="empty">Your cart is empty.<br />Time to gear up.</div> :
            cart.map((x, i) => (
              <div className="litem" key={i}>
                <div className="thumb"><Field img={x.img} a={x.a} b={x.b} /></div>
                <div className="t" style={{ flex: 1 }}>
                  <h5>{x.name}</h5><div className="s">Size {x.size} · ${x.price}</div>
                  <div className="qty"><button onClick={() => setQty(i, -1)}>−</button><span>{x.qty}</span><button onClick={() => setQty(i, 1)}>+</button></div>
                  <button className="rm" onClick={() => rm(i)}>Remove</button>
                </div>
                <div style={{ fontWeight: 800 }}>${x.qty * x.price}</div>
              </div>
            ))}
        </div>
        {cart.length > 0 && (
          <div className="df">
            <div className="row"><span>Subtotal</span><span>${subtotal}</span></div>
            <button className="btn dark" style={{ width: "100%", justifyContent: "center" }}
              onClick={() => { setCartOpen(false); nav("checkout"); }}>Checkout →</button>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
